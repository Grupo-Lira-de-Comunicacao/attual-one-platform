name: TEMP ATTUAL CRM Auth Inspect

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-attual-crm-auth-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect ATTUAL CRM Auth URL config
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: hcheyicbontucxotswgh
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          code=$(curl -sS -o "$tmp" -w '%{http_code}' \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth")
          echo "http_status=$code"
          test "$code" = "200"
          jq '{site_url, uri_allow_list, uri_allow_list_type:(.uri_allow_list|type)}' "$tmp"
