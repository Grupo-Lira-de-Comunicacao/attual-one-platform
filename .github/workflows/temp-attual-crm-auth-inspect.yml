name: TEMP ATTUAL CRM Auth Inspect

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-attual-crm-auth-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Locate existing Supabase management credential and inspect CRM Auth
        shell: bash
        env:
          CANDIDATE_1: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CANDIDATE_2: ${{ secrets.SUPABASE_TOKEN }}
          CANDIDATE_3: ${{ secrets.SUPABASE_PAT }}
          CANDIDATE_4: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
          CANDIDATE_5: ${{ secrets.SUPABASE_ACCESS_TOKEN_ATTUAL_ONE }}
          CANDIDATE_6: ${{ secrets.SUPABASE_ACCESS_TOKEN_ATTUALONE }}
          CANDIDATE_7: ${{ secrets.ATTUAL_SUPABASE_ACCESS_TOKEN }}
          CANDIDATE_8: ${{ secrets.SUPABASE_ACCESS_TOKEN_2 }}
          PROJECT_REF: hcheyicbontucxotswgh
        run: |
          set -euo pipefail
          TOKEN=""
          for name in CANDIDATE_1 CANDIDATE_2 CANDIDATE_3 CANDIDATE_4 CANDIDATE_5 CANDIDATE_6 CANDIDATE_7 CANDIDATE_8; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              echo "$name=present"
              TOKEN="$value"
              break
            else
              echo "$name=absent"
            fi
          done
          test -n "$TOKEN"
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          code=$(curl -sS -o "$tmp" -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth")
          echo "http_status=$code"
          test "$code" = "200"
          jq '{site_url, uri_allow_list, uri_allow_list_type:(.uri_allow_list|type)}' "$tmp"
