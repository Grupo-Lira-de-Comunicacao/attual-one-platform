name: Attual One CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: attual-one-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Tests
        run: npm test
      - name: Type check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Matrix M4 contract
        run: |
          set -e
          test -f supabase/migrations/202609070002_matrix_person_links.sql
          test -f app/api/integrations/matrix/links/route.ts
          test -f app/api/integrations/matrix/signals/route.ts
          test -f app/api/storefront/[slug]/account/matrix-link/route.ts
          grep -q 'explicit_user_bridge' supabase/migrations/202609070002_matrix_person_links.sql
          grep -q 'marketing_allowed: false' app/api/integrations/matrix/signals/route.ts
          grep -q 'external_action_allowed: false' app/api/integrations/matrix/signals/route.ts
          grep -q 'processing_status: "suppressed"' app/api/integrations/matrix/links/route.ts
          grep -q 'pii_sent_to_matrix: false' app/api/storefront/[slug]/account/matrix-link/route.ts
